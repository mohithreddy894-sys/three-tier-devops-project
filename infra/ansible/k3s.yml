---
- name: Set up Kubernetes (k3s) on the server
  hosts: server
  become: true
  gather_facts: false

  tasks:
    - name: Wait for SSH
      ansible.builtin.wait_for_connection:
        timeout: 180

    - name: Wait for first-boot setup to finish
      ansible.builtin.command: cloud-init status --wait
      changed_when: false

    - name: Download the k3s installer
      ansible.builtin.get_url:
        url: https://get.k3s.io
        dest: /tmp/k3s-install.sh
        mode: "0755"

    - name: Install k3s
      ansible.builtin.command: /tmp/k3s-install.sh
      args:
        creates: /usr/local/bin/k3s

    - name: Wait for the node to be Ready
      ansible.builtin.command: k3s kubectl wait --for=condition=Ready node --all --timeout=60s
      register: node_ready
      until: node_ready.rc == 0
      retries: 10
      delay: 10
      changed_when: false

    - name: Get the node details
      ansible.builtin.command: k3s kubectl get nodes
      register: nodes
      changed_when: false

    - name: Show the node
      ansible.builtin.debug:
        var: nodes.stdout_lines
