services:
  database:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: releasedb
      MYSQL_USER: releaseuser
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    environment:
      DB_HOST: database
      DB_NAME: releasedb
      DB_USER: releaseuser
      DB_PASSWORD: ${DB_PASSWORD}
      RELEASE_TOKEN: ${RELEASE_TOKEN}
    depends_on:
      database:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "8081:80"
    depends_on:
      - backend

volumes:
  db-data:
